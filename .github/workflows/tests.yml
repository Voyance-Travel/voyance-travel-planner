name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - uses: denoland/setup-deno@v1
        with: { deno-version: v1.x }
      - name: Install
        run: bun install --frozen-lockfile
      - name: Vitest
        run: bun run test
      - name: Deno (edge function tests)
        # Glob covers both layouts: <fn>/__tests__/*.test.ts and <fn>/*.test.ts.
        # Deno dedupes when both patterns match the same file. New test files
        # are picked up automatically - no workflow edit required.
        #
        # --no-check: edge functions deploy via the Lovable/esbuild bundler, not
        # `tsc`, and the codebase carries pre-existing loose-typing errors (e.g.
        # `string | null` into a `string` param, NodeJS.Timeout vs number) that
        # `deno check` flags but that bundle + run correctly. Type-checking here
        # only produced a perpetually-red, non-actionable signal; running the
        # tests is the meaningful gate. Behaviour is still fully exercised.
        run: |
          deno test --no-check --allow-read --allow-env --allow-net \
            'supabase/functions/**/__tests__/*.test.ts' \
            'supabase/functions/**/*.test.ts'
